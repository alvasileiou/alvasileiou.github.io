<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Δοκιμή προσθήκης επαφής</title>
<style>
body{font-family:Arial,sans-serif;max-width:560px;margin:24px auto;padding:20px;color:#222;line-height:1.5}h1{font-size:1.45rem}button,.button{display:block;width:100%;box-sizing:border-box;padding:15px;margin:14px 0;font-size:1rem;text-align:center;border:0;border-radius:8px;background:#1458a6;color:#fff;text-decoration:none}button.secondary,.button.secondary{background:#555}.note{font-size:.95rem;color:#555}code{overflow-wrap:anywhere}
</style>
</head>
<body>
<h1>Δοκιμή προσθήκης επαφής</h1>
<p><strong>Βασιλείου Αλέξανδρος</strong></p>
<p>Κινητό: 699 847 8440<br>Email: vasileioual@gmail.com</p>
<p class="note">Αυτή είναι δοκιμαστική σελίδα. Πρώτα δοκιμάζουμε αν το Android ανοίγει τη φόρμα νέας επαφής. Αν δεν την ανοίξει, χρησιμοποίησε τη λήψη VCF.</p>
<a class="button" id="intent" href="intent://contacts/people/#Intent;scheme=content;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;S.name=Βασιλείου%20Αλέξανδρος;S.phone=+306998478440;S.email=vasileioual%40gmail.com;end">Δοκιμή ανοίγματος φόρμας επαφής</a>
<button class="secondary" id="download">Εναλλακτικά: Λήψη VCF</button>
<p id="status" class="note" aria-live="polite"></p>
<script>
const vcard = [
'BEGIN:VCARD','VERSION:3.0','N:Βασιλείου;Αλέξανδρος;;;','FN:Βασιλείου Αλέξανδρος',
'TEL;TYPE=CELL:+306998478440','EMAIL;TYPE=INTERNET:vasileioual@gmail.com',
'ADR;TYPE=WORK:;;Θεσσαλονίκη;;;;Ελλάδα',
'URL:https://alvasileiou.github.io/',
'NOTE:Δοκιμαστική επαφή. Η ιδιότητα και οι σύνδεσμοι θα οριστικοποιηθούν ανά επαγγελματική κάρτα.',
'END:VCARD',''].join('\r\n');
document.getElementById('download').addEventListener('click',()=>{
 const blob=new Blob([vcard],{type:'text/vcard;charset=utf-8'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='contact-test.vcf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
 document.getElementById('status').textContent='Έγινε αίτημα λήψης του αρχείου VCF.';
});
</script>
</body>
</html>
