<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#073d5c">
<title>Βασιλείου Αλέξανδρος | Ψηφιακή επαγγελματική κάρτα</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e8f0f5;color:#123d57;font-family:Arial,Helvetica,sans-serif}
main{max-width:980px;margin:0 auto;padding:22px 14px 32px}
.card-wrap{position:relative;width:100%;line-height:0;filter:drop-shadow(0 10px 22px rgba(5,45,70,.16))}
.card-wrap img{display:block;width:100%;height:auto;border-radius:18px}
.phone-link{position:absolute;left:30.8%;top:51.5%;width:23%;height:9%;display:block}
.email-link{position:absolute;left:30.5%;top:73%;width:32%;height:10%;display:block}
.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.actions a{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:13px 20px;border-radius:12px;background:#073d5c;color:#fff;text-decoration:none;font-weight:700;font-size:16px}
.actions a.secondary{background:#fff;color:#073d5c;border:1px solid #c8d9e3}
.note{text-align:center;color:#526f80;font-size:14px;line-height:1.5;margin:16px auto 0;max-width:620px}
@media(max-width:480px){main{padding:14px 8px 24px}.card-wrap img{border-radius:10px}.actions a{width:100%;font-size:15px}}
</style>
</head>
<body>
<main>
  <div class="card-wrap">
    <img src="business-card.jpg" alt="Επαγγελματική κάρτα Βασιλείου Αλέξανδρου, Αγρονόμου Τοπογράφου Μηχανικού. Τηλέφωνο 699 847 8440, email vasileioual@gmail.com, Θεσσαλονίκη.">
    <a class="phone-link" href="tel:+306998478440" aria-label="Κλήση στο 699 847 8440" title="Κλήση"></a>
    <a class="email-link" href="mailto:vasileioual@gmail.com" aria-label="Αποστολή email" title="Email"></a>
  </div>
  <div class="actions">
    <a href="contact.vcf" aria-label="Άνοιγμα επαφής για αποθήκευση">＋ Προσθήκη στις επαφές</a>
    <a class="secondary" href="tel:+306998478440">☎ Κλήση</a>
    <a class="secondary" href="mailto:vasileioual@gmail.com">✉ Email</a>
  </div>
  <p class="note">Πατήστε «Προσθήκη στις επαφές» για να ανοίξετε την επαγγελματική επαφή. Κατά την αποθήκευση, ο σύνδεσμος της ψηφιακής κάρτας περιλαμβάνεται στα στοιχεία της επαφής.</p>
</main>
</body>
</html>
